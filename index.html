<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumBot | AI Voice POC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Warm Travel Colors */
            --primary-color: #f97316; /* Orange */
            --secondary-color: #facc15; /* Yellow/Gold */
            --bg-color: #1c1917; /* Warm Dark Grey */
            --surface-color: rgba(255, 255, 255, 0.08);
            --text-color: #fafaf9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #292524 0%, #0c0a09 100%);
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* --- Layout Grid --- */
        .main-layout {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100%;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
        }

        header { text-align: center; }
        h1 { margin: 0; font-weight: 600; font-size: 1.4rem; letter-spacing: 0.5px; }
        .subtitle { color: #d6d3d1; font-size: 0.9rem; margin-top: 5px; }

        /* --- Chat Log --- */
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }
        .chat-container::-webkit-scrollbar { display: none; }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .user-msg {
            align-self: flex-end;
            background: rgba(249, 115, 22, 0.2);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-bottom-right-radius: 4px;
            color: #ffedd5;
        }

        .agent-msg {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
            color: #f5f5f4;
        }

        .agent-msg.typing { border-left: 3px solid var(--primary-color); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Visualizer --- */
        .visualizer-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.4);
            transition: all 0.3s ease;
        }

        .visualizer-wrapper.speaking .orb {
            animation: pulse 0.5s infinite alternate;
            box-shadow: 0 0 70px rgba(249, 115, 22, 0.7);
        }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

        /* --- Controls --- */
        .controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        button {
            background: var(--surface-color); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 15px 30px; border-radius: 50px; cursor: pointer;
            backdrop-filter: blur(10px); transition: all 0.3s; font-size: 1rem;
        }
        button:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        #startBtn { 
            background: linear-gradient(90deg, var(--primary-color), #ea580c); 
            border: none; font-weight: 600; 
        }
        #stopBtn { display: none; background: rgba(220, 38, 38, 0.2); border-color: rgba(220, 38, 38, 0.5); color: #fecaca; }
        
        #status-msg { text-align: center; color: #a8a29e; font-size: 0.8rem; margin-top: 15px; }

    </style>
</head>
<body>

    <div class="main-layout">
        <header>
            <h1>QuantumBot Ai Agent POC</h1>
            <div class="subtitle">Global Travel Expert</div>
        </header>

        <div class="chat-container" id="chat-container">
            <div class="message agent-msg">
                Namaste! I am Leela ben. Where are you planning to travel next? 🌍
            </div>
        </div>

        <div class="visualizer-wrapper" id="vis-wrapper">
            <div class="orb"></div>
            <div id="status-msg">Ready to explore?</div>
        </div>

        <div class="controls">
            <button id="startBtn">📞 Start Call</button>
            <button id="stopBtn">❌ End Call</button>
        </div>
    </div>

  <script>
        let socket;
        let audioContext;
        let processor;
        let inputSource;
        
        // Audio Queue Management
        let nextStartTime = 0;
        let audioQueue = []; // Tracks all active audio nodes
        let ignoreAudio = false; // Flag to discard stale packets

        let currentAgentBubble = null;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusMsg = document.getElementById('status-msg');
        const visWrapper = document.getElementById('vis-wrapper');
        const chatContainer = document.getElementById('chat-container');
        const SAMPLE_RATE = 24000;

        startBtn.onclick = async () => {
            statusMsg.innerText = "Connecting to Lal Bhai...";
            try {
                socket = new WebSocket("ws://localhost:8000/call");
                socket.binaryType = "arraybuffer";

                socket.onopen = async () => {
                    statusMsg.innerText = "Listening...";
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'block';
                    await startAudioCapture();
                };

                socket.onmessage = async (event) => {
                    if (typeof event.data === "string") {
                        const msg = JSON.parse(event.data);
                        handleServerEvent(msg);
                    } else {
                        // Handle Audio Packet
                        playPCMChunk(event.data);
                    }
                };

                socket.onclose = () => resetUI();

            } catch (err) {
                console.error(err);
                statusMsg.innerText = "Connection Failed";
            }
        };

        stopBtn.onclick = () => {
            if (socket) socket.close();
            if (audioContext) audioContext.close();
            resetUI();
        };

        function resetUI() {
            statusMsg.innerText = "Session Ended";
            startBtn.style.display = 'block';
            stopBtn.style.display = 'none';
            visWrapper.classList.remove('speaking');
            stopAllAudio(); // Ensure silence
        }

        // --- CORE LOGIC: STOP EVERYTHING ---
        function stopAllAudio() {
            console.log("🛑 STOPPING ALL AUDIO");
            
            // 1. Stop all queued source nodes
            audioQueue.forEach(source => {
                try { source.stop(); } catch(e) {}
            });
            audioQueue = []; // Clear the list

            // 2. Reset the timeline so next audio plays IMMEDIATELY
            if (audioContext) {
                nextStartTime = audioContext.currentTime; 
            }

            // 3. Ignore incoming packets for a short moment (prevents network lag from playing old audio)
            ignoreAudio = true;
            setTimeout(() => { ignoreAudio = false; }, 500); // 500ms safety window
        }

        function handleServerEvent(msg) {
            if (msg.type === "interrupt") {
                // INTERRUPTION DETECTED
                stopAllAudio();
                
                // UI Cleanup
                visWrapper.classList.remove('speaking');
                if (currentAgentBubble) {
                    currentAgentBubble.innerText += " ...";
                    currentAgentBubble.classList.remove('typing');
                    currentAgentBubble = null;
                }
            }
            else if (msg.type === "user_transcript") {
                addMessage(msg.text, 'user-msg');
            } 
            else if (msg.type === "agent_transcript_delta") {
                // If we get new text, it means a NEW response has started
                // So we stop ignoring audio (if we were)
                ignoreAudio = false;

                if (!currentAgentBubble) {
                    currentAgentBubble = addMessage("", 'agent-msg typing');
                }
                currentAgentBubble.innerText += msg.text;
                scrollToBottom();
            } 
            else if (msg.type === "agent_response_done") {
                if (currentAgentBubble) {
                    currentAgentBubble.classList.remove('typing');
                    currentAgentBubble = null;
                }
            }
        }

        function playPCMChunk(arrayBuffer) {
            if (!audioContext || ignoreAudio) return; // Drop packet if we are ignoring

            // Update UI
            visWrapper.classList.add('speaking');
            clearTimeout(window.speakTimeout);
            window.speakTimeout = setTimeout(() => visWrapper.classList.remove('speaking'), 300);

            // Convert PCM
            const int16Array = new Int16Array(arrayBuffer);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) { float32Array[i] = int16Array[i] / 32768; }
            
            const buffer = audioContext.createBuffer(1, float32Array.length, SAMPLE_RATE);
            buffer.copyToChannel(float32Array, 0);
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            
            // Scheduling
            const currentTime = audioContext.currentTime;
            if (nextStartTime < currentTime) nextStartTime = currentTime;
            source.start(nextStartTime);
            nextStartTime += buffer.duration;

            // --- QUEUE MANAGEMENT ---
            // Add to queue
            audioQueue.push(source);
            
            // Remove from queue when done playing
            source.onended = () => {
                audioQueue = audioQueue.filter(s => s !== source);
            };
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function startAudioCapture() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: { channelCount: 1, sampleRate: SAMPLE_RATE, echoCancellation: true, noiseSuppression: true }
            });
            inputSource = audioContext.createMediaStreamSource(stream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            inputSource.connect(processor);
            processor.connect(audioContext.destination);

            processor.onaudioprocess = (e) => {
                if (socket.readyState === WebSocket.OPEN) {
                    const inputData = e.inputBuffer.getChannelData(0);
                    socket.send(floatTo16BitPCM(inputData));
                }
            };
        }

        function floatTo16BitPCM(output) {
            const buffer = new ArrayBuffer(output.length * 2);
            const view = new DataView(buffer);
            for (let i = 0; i < output.length; i++) {
                let s = Math.max(-1, Math.min(1, output[i]));
                s = s < 0 ? s * 0x8000 : s * 0x7FFF;
                view.setInt16(i * 2, s, true);
            }
            return buffer;
        }
    </script>
</body>
</html>
