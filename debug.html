<!DOCTYPE html>
<html>
<head>
    <title>Lalo POC</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
        #box { background: white; padding: 20px; border-radius: 15px; display: inline-block; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #transcript { height: 100px; overflow-y: auto; border: 1px solid #ddd; margin: 10px 0; padding: 10px; text-align: left; font-size: 14px; }
    </style>
</head>
<body>
    <div id="box">
        <h2>Lalo Voice Agent</h2>
        <div id="transcript">Ready...</div>
        <button id="btn" style="padding: 15px 30px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px;">📞 Start Call</button>
    </div>

    <script>
        let socket, audioCtx, nextTime = 0;
        const btn = document.getElementById('btn');
        const transcript = document.getElementById('transcript');

        btn.onclick = async () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            socket = new WebSocket('ws://localhost:8000/ws/lalo');
            socket.binaryType = 'arraybuffer';

            socket.onopen = () => {
                btn.innerText = "Connected";
                transcript.innerText = "";
                const source = audioCtx.createMediaStreamSource(stream);
                const processor = audioCtx.createScriptProcessor(4096, 1, 1);
                source.connect(processor);
                processor.connect(audioCtx.destination);
                processor.onaudioprocess = (e) => {
                    const input = e.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) pcm16[i] = input[i] * 0x7FFF;
                    if (socket.readyState === 1) socket.send(pcm16.buffer);
                };
            };

            socket.onmessage = async (e) => {
                if (typeof e.data === 'string') {
                    transcript.innerText += e.data.replace("TRANSCRIPT:", "");
                    return;
                }

                // THE STATIC FIX: Convert Int16 to Float32
                const int16 = new Int16Array(e.data);
                const float32 = new Float32Array(int16.length);
                for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

                const buffer = audioCtx.createBuffer(1, float32.length, 24000);
                buffer.getChannelData(0).set(float32);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);

                let now = audioCtx.currentTime;
                if (nextTime < now) nextTime = now + 0.1;
                source.start(nextTime);
                nextTime += buffer.duration;
            };
        };
    </script>
</body>
</html>
